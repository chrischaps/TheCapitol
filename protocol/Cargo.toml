[package]
name = "capitol-protocol"
description = "The Capitol's wire protocol: WebSocket messages, REST DTOs, terrain types and shared game rules."
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
# Server-side derives: OpenAPI schemas and query params (utoipa) and database rows
# (sqlx::FromRow). The backend turns this on; clients leave it off and stay light.
backend = ["dep:utoipa", "dep:sqlx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Pure-Rust trig, so the world is bit-identical on every platform (fmath, #180)
libm = "0.2"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

utoipa = { version = "5", features = ["uuid", "chrono"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Exact float parsing, so a fixture's 0.13999999999999999 reads back as itself
# and round-trips byte for byte (the default parser can be an ulp out)
serde_json = { version = "1", features = ["float_roundtrip"] }
