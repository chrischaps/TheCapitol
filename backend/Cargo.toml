[package]
name = "capitol-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared wire types and rules (with the server-only derives)
capitol-protocol = { path = "../protocol", features = ["backend"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The profiler (D3.3), only with `--features profile`. tracing-tracy 0.11 is on
# tracy-client 0.18, the Flint client's, so one Tracy viewer reads both
tracing-tracy = { version = "0.11", optional = true, features = ["only-localhost", "ondemand"] }
tracy-client = { version = "0.18", optional = true }
thiserror = "2"
rand = "0.8"
sha2 = "0.10"
futures = "0.3"

# API Documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[features]
# Tracy (D3.3): every span a zone, each tick a frame. Off by default, so the
# usual build has no tracy in it at all
profile = ["dep:tracing-tracy", "dep:tracy-client"]

[dev-dependencies]
# Thread CPU time, so a timing test isn't failed by other tests or builds sharing the CPU (#91)
cpu-time = "1"

[lints.clippy]
# Query rows are read as tuples (`query_as::<_, (Uuid, String, i32, ...)>`),
# which this lint flags; naming each one wouldn't make them clearer.
type_complexity = "allow"
