# Container types: the shapes of slot grids.
#
# Upserted into `container_types` at startup (E0.3, see backend/src/content/).
# One [[container]] table per type:
#
#   id              the key. Containers name it, so retire it rather than delete it.
#   name            shown to players
#   slot_count      how many slots
#   layout_columns  how many columns the client lays them out in

[[container]]
id = "player_inventory"
name = "Player Inventory"
slot_count = 24
layout_columns = 6

[[container]]
id = "crafting_input"
name = "Crafting Input"
slot_count = 4
layout_columns = 2

[[container]]
id = "crafting_output"
name = "Crafting Output"
slot_count = 1
layout_columns = 1

[[container]]
id = "station_inventory"
name = "Station Inventory"
slot_count = 16
layout_columns = 4

# The market's shared escrow (E3.1): each sell order's units wait here as a
# stack with no slot and no owner, so it has no grid
[[container]]
id = "market_escrow"
name = "Market Escrow"
slot_count = 0
layout_columns = 1

# Where a player's cancelled, expired and bought goods wait (E3.1, plan D6)
[[container]]
id = "market_box"
name = "Market Box"
slot_count = 48
layout_columns = 8

# The bazaar's shared stock (E3.10, plan D6): each listing's units wait here
# as a stack with no slot and no owner, as a sell order's do in the escrow
[[container]]
id = "bazaar_stock"
name = "Bazaar Stock"
slot_count = 0
layout_columns = 1
