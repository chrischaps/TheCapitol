# Container types: the shapes of slot grids.
#
# Upserted into `container_types` at startup (E0.3, see backend/src/content/).
# One [[container]] table per type:
#
#   id              the key. Containers name it, so retire it rather than delete it.
#   name            shown to players
#   slot_count      how many slots
#   layout_columns  how many columns the client lays them out in

[[container]]
id = "player_inventory"
name = "Player Inventory"
slot_count = 24
layout_columns = 6

[[container]]
id = "crafting_input"
name = "Crafting Input"
slot_count = 4
layout_columns = 2

[[container]]
id = "crafting_output"
name = "Crafting Output"
slot_count = 1
layout_columns = 1

[[container]]
id = "station_inventory"
name = "Station Inventory"
slot_count = 16
layout_columns = 4
