[[recipe]]
id = "craft_forge"
name = "Forge Kit"
description = "Build a forge kit at a workbench, from rope and fiber."
category = "station_crafting"
required_station_type = "workbench"
base_duration_ticks = 120
inputs = [
    { item_type = "rope", quantity = 4, quality_weight = 0.7 },
    { item_type = "fiber", quantity = 6, quality_weight = 0.3 },
]
outputs = [{ item_type = "forge_kit", quantity_min = 1, quantity_max = 1 }]
quality_weights = { variance_min = -3, variance_max = 3 }
crafting_requirements = {}
