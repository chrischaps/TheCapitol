# Recipes: inputs in, outputs out, with the quality cascade's weights.
#
# Upserted into `recipes` at startup (E0.3, see backend/src/content/).
# One [[recipe]] table per recipe:
#
#   id                     the key
#   name, description      shown to players
#   category               hand_crafting or station_crafting
#   required_station_type  a station id from stations.toml, or leave it out
#                          for a hand recipe
#   base_duration_ticks    how long one craft takes (10 ticks a second)
#   inputs                 [{ item_type, quantity, quality_weight }]: how much
#                          of each input's quality flows into the output,
#                          relative to the other inputs
#   outputs                [{ item_type, quantity_min, quantity_max }]
#   quality_weights        { variance_min, variance_max, station?, tool? }:
#                          the random spread added to the output's quality,
#                          and the station's and tool's shares of it (0 to 1).
#                          Left out, a station recipe gives the station 0.2
#                          and the tool gets 0; the inputs split the rest.
#                          The formula is protocol/src/rules/quality.rs (D1).
#   crafting_requirements  { tool_type? }: a tool type the crafter must hold
#                          (E1.5). The best one gives the tool term its quality
#                          and wears once per craft. Give it a quality_weights
#                          tool share, or it counts for nothing.
#
# Item ids must be in items.toml, and no item may be its own ingredient,
# however many recipes away.

[[recipe]]
id = "rope_basic"
name = "Basic Rope"
description = "Twist plant fibers into sturdy rope."
category = "hand_crafting"
base_duration_ticks = 50
inputs = [{ item_type = "fiber", quantity = 2, quality_weight = 0.5 }]
outputs = [{ item_type = "rope", quantity_min = 1, quantity_max = 1 }]
quality_weights = { variance_min = -3, variance_max = 3 }
crafting_requirements = {}

[[recipe]]
