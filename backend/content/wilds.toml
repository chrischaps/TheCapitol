# Where the wilds' nodes grow, and how good they are there (W6, #199).
#
# The Wilderness runs from r4600 to the world's edge at r6800 (moved out 800
# with the rural edge, #308). The land is 0
# out to r4700, then rises through the foothills into eight massifs whose
# crests stand near 640 (protocol `land`). Only the node planner reads this
# file (backend/src/engine/node_spawn/wilds.rs); nothing is synced to a table.
#
# [quality]   a wild node's base quality is drawn from its spawn row's
#             quality_floor (resources.toml) up to a ceiling: its resource's
#             base_quality_max plus the `depth` and `height` points here,
#             never over 100. Each is a list of [at, add] rows, rising by
#             `at`, interpolated between them and held flat past either end.
#   depth     at: radius from the centre
#   height    at: the land's height there
#
# [[habitat]] one per resource with a wilderness spawn row: where in the
#             wilds its nodes grow. Each bound is [lo, hi], inclusive, and
#             optional. The planner also keeps every node off the trails and
#             the water, and on ground a walker can reach.
#   resource  an id from resources.toml
#   height    the land's height
#   slope     rise over run; at most rules::ground::CLIFF_SLOPE (1.2)
#   depth     radius from the centre
#   cover     woods only: the share of the habitat that's woods
#   woods_of  woods only: grow in this resource's woods' noise field rather
#             than one of its own, so the woods run on from its (#225)
#   massifs   "even" or "odd": only on those of the ranges' massifs
#             (protocol `land::massif_at`), so copper and tin keep apart

[quality]
depth = [[4600, -15], [5200, 0], [6400, 10]]
height = [[0, 0], [250, 3], [550, 8]]

# Old growth, on the valley floors and the low ground between the ranges,
# in the rural trees' woods, so they run on over the rural edge.
[[habitat]]
resource = "old_growth"
height = [0, 220]
slope = [0, 0.35]
cover = 0.35
woods_of = "tree"

[[habitat]]
resource = "fallen_branches"
slope = [0, 0.5]

# Scree: the broken ground below the crags.
[[habitat]]
resource = "rock_outcrop"
height = [80, 500]
slope = [0.45, 1.0]

# High on the bare, steep rock of the ranges.
[[habitat]]
resource = "iron_vein"
height = [380, 900]
slope = [0.55, 1.15]

# The banks of the rivers, streams and lakes.
[[habitat]]
resource = "clay_bank"
slope = [0, 0.4]

# Bronze's ores, on the ranges' flanks below the iron: copper on the even
# massifs, tin on the odd (#225).
[[habitat]]
resource = "copper_vein"
height = [200, 450]
slope = [0.45, 1.1]
massifs = "even"

[[habitat]]
resource = "tin_vein"
height = [200, 450]
slope = [0.45, 1.1]
massifs = "odd"

# Reeds, in the lakes' shallows and the slow rivers' margins, standing in
# the water (#225).
[[habitat]]
resource = "reed_bed"
slope = [0, 0.4]
