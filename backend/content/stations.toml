# Station types: what a player can place on a plot, or off one.
#
# Upserted into `station_types` at startup (E0.3, see backend/src/content/).
# One [[station]] table per type:
#
#   id                 the key. Placed stations name it, so retire it rather than delete it.
#   name               shown to players
#   category           crafting or storage
#   kit                the item id that places it, and that taking it down
#                      gives back. Some recipe must make the kit.
#   slot_count         its inventory's slots
#   layout_columns     how many columns the client lays them out in
#   interaction_range  how close a player must stand to use it
#   icon, description  optional, for the client
#   off_plot           optional, false if left out. True lets it stand off a
#                      plot, on dry ground no lot covers, for its owner alone
#                      (#187). On a lot it still needs the lot to be yours.
#   ground_only        optional, false if left out. True keeps it to the ground
#                      floor: a fire, which can't go upstairs (V3.3, #475).
#
# Every crafting station must be some recipe's required_station_type.

[[station]]
id = "workbench"
name = "Workbench"
category = "crafting"
kit = "workbench_kit"
slot_count = 16
layout_columns = 4
interaction_range = 75.0
icon = "workbench"
description = "Craft wooden items and tools"
off_plot = true

