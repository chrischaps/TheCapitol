# Item types: everything that can sit in a slot.
#
# Upserted into `item_types` at startup (E0.3, see backend/src/content/).
# One [[item]] table per type:
#
#   id         the key. Never rename or delete one: items in players' hands
#              name it. Move a type you no longer want to retired.toml instead.
#   name       shown to players
#   category   raw_material, processed_material, placeable (a station kit)
#              or tool
#   stackable  false for one-per-slot items such as kits and tools
#   weight     per unit
#   tool       only for a tool (E1.4): { tool_type, tier, base_power,
#              max_durability }. tool_type is sickle, axe, pickaxe, hammer
#              or saw; tier is the material, stone, bronze, iron or steel.
#              base_power and max_durability are its power and uses at Q50:
#              quality scales both, from half at Q0 to one and a half at
#              Q100 (protocol/src/rules/tools.rs). Tools don't stack, and
#              a recipe makes them one at a time.
#
# Every item must be obtainable: a resource yields it, or a recipe makes it.

[[item]]
id = "fiber"
name = "Plant Fiber"
category = "raw_material"
stackable = true
weight = 0.1

[[item]]
id = "rope"
name = "Rope"
category = "processed_material"
stackable = true
weight = 0.2

[[item]]
id = "workbench_kit"
name = "Workbench Kit"
category = "placeable"
stackable = false
weight = 10

[[item]]
id = "forge_kit"
name = "Forge Kit"
category = "placeable"
stackable = false
weight = 15

[[item]]
id = "chest_kit"
name = "Storage Chest Kit"
category = "placeable"
stackable = false
weight = 8

# The one tool until E2.4 (#163) brings stone and the rest. Its recipe makes
# do with rope and fiber.
[[item]]
id = "stone_sickle"
name = "Stone Sickle"
category = "tool"
stackable = false
weight = 1.5
tool = { tool_type = "sickle", tier = "stone", base_power = 6.0, max_durability = 60 }

