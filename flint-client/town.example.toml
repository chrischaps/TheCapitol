# capitol-town's roster (C1.1). Copy it to town.toml, which is git-ignored
# because it holds keys, or let `capitol-town mint --count <n>` write it.
#
# Each citizen is an account an admin minted (POST /admin/citizens, C0.1),
# signed in by its key. A key is `key = "cap_..."` here, or `key_file`, a
# path from this file's directory holding the key alone.
#
# A role is one of the sim's: gatherer-fiber, gatherer-wood, gatherer-ore,
# crafter-planks, crafter-ingots, crafter-tools, builder; or merchant (C1.6),
# who earns a float banking fiber, then makes a market in three goods at the
# hall. `mint --count n --role merchant` makes merchants.
#
# The persona (C1.2). `mint` writes all of it, drawn from the citizen's
# name; any of the five lines left out is drawn from the name again, so
# they're there to read and to change.
#
# - home: the zone (rural or suburban) its lot will be in, the avenue it
#   lives off (a compass point, as "south-west"), and how far out through
#   the zone, 0 to 1. Until it has saved for a lot it sleeps on the avenue.
# - market: where it keeps its market hours, "hall" or "bazaar".
# - schedule: its day on the server's game clock (a game day is two real
#   hours): what it does while it's on. Work from wake, at the market for
#   its hours, home at dusk, and from there the night's work, crafting and
#   gathering, with night proper at bed. Each must come after the one
#   before. Game night doesn't log it out; its habit does.
# - habit (#276): when it plays, on the real clock. Its kind is dedicated
#   (4 to 8 hours most days), regular (1 to 3 hours, 3 to 5 days a week),
#   casual (about an hour once or twice a week) or lapsed (away for weeks,
#   then back for a week or two), and its zone the hours from UTC its
#   evenings and weekends are in, -12 to 14. `capitol-town habits` shows
#   who's on when.
# - temperament: each 0 to 1. Thrift is how many deeds' worth it saves
#   before it buys a home; sociability, how long it stays at the market.

# The server, unless --server or $CAPITOL_SERVER says otherwise.
server = "http://localhost:3000"

# How citizens make up their minds (C1.3): a stack of decision layers,
# bottom first, each asked in turn until one is sure. "rules" is the
# default. "jev" (C3.3) asks TypeSafe's Jev about the rules' close calls,
# for about 1 cent a citizen-day; it reads $TYPESAFE_API_KEY, and with none
# it passes every question on. "jev-router" (OpenRouter) is there for
# replay, not for a live town. "claude-haiku" and "claude-sonnet" (C3.2)
# ask Claude through $ANTHROPIC_API_KEY. For menu decisions they're for
# replay too: Jev settles what it's sure of and its own best guess stands
# for the rest, and the LLMs' job is a citizen's words (#311). If you do
# stack one, put it above a low Jev threshold so it's asked rarely:
# ["rules", "jev@0.3", "claude-haiku"] asks Haiku about 6% of the time, for
# under 1 cent a citizen-day more. A layer may set its threshold:
# "jev@0.8". A citizen may name its own `layers`.
layers = ["rules"]
# layers = ["rules", "jev"]

# When citizens play (#276): the share of each habit `mint` draws, by
# weight. A town of this mix is on about 3% of the time, so keeping 20 on
# takes about 640 citizens: `mint --online 20` makes that many. Changing
# the mix re-draws only the citizens whose habit the roster leaves out, and
# only those near a boundary.
[habits]
mix = { dedicated = 0.05, regular = 0.30, casual = 0.55, lapsed = 0.10 }

[[citizen]]
name = "Ada Reeder"
role = "gatherer-fiber"
key = "cap_replace_with_the_minted_secret"
home = { zone = "rural", avenue = "south-west", depth = 0.42 }
market = "bazaar"
schedule = { wake = "05:40", market = "14:10-16:25", home = "19:05", bed = "20:55" }
temperament = { thrift = 0.31, risk = 0.58, sociability = 0.66, patience = 0.47 }
habit = { kind = "regular", zone = -5 }

[[citizen]]
name = "Percy Sawyer"
role = "crafter-planks"
key_file = "keys/percy-sawyer.key"
