[package]
name = "capitol-core"
description = "Networking and state for The Capitol's Flint client. No engine dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
capitol-protocol.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: an f64 in a decision log reads back to the bit (#545)
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
# capitol-town's roster, town.toml (C1.1)
toml = { workspace = true }
tracing = "0.1"
uuid = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# signal: Ctrl-C stops capitol-town gracefully (C1.1)
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
# rustls rather than the platform TLS, so https/wss servers work without
# OpenSSL. gzip is ready for B3 (#18), which compresses /terrain.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# The mock server in tests/net.rs is built on the backend's own stack.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
