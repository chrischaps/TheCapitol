[package]
name = "capitol-client"
description = "The Capitol, as a Flint game."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "capitol"
path = "src/main.rs"

[features]
# Flint's frame profiler (ADR 0109): `cargo build --release --features
# profile`, then Tracy's viewer finds the running client (D5.4, #374).
profile = ["flint-player/profile"]

[dependencies]
capitol-core = { workspace = true }
capitol-protocol = { workspace = true }
flint-core = { workspace = true }
flint-ecs = { workspace = true }
flint-import = { workspace = true }
flint-player = { workspace = true }
flint-render = { workspace = true }
flint-runtime = { workspace = true }
flint-scene = { workspace = true }
flint-schema = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
# Local time for the market chart's axis and trades (E3.6)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rhai = { workspace = true }
resvg = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { workspace = true }
uuid = "1"
winit = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = "0.1"
tracing-subscriber = { workspace = true }

[dev-dependencies]
flint-particles = { workspace = true }
