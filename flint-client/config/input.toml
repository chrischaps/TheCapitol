# The Capitol's input, layered over Flint's built-in defaults (which keep
# WASD as move_*, E as interact, and so on). The scene names it
# (input_config); a player's own rebinds go over it, in flint/input_capitol.toml
# under the OS config directory.
#
# The camera rig (scripts/camera.rhai) is laid out as in Cities: Skylines:
# WASD moves, Q/E orbit, R/F zoom, and the wheel zooms too. The wheel isn't
# bound here, because Flint doesn't feed it to actions yet (issue #67). The
# rig reads it through cap_take_wheel(). H stands in for Home and R/F for
# +/-, which Flint can't bind yet (issue #68).

version = 1
game_id = "capitol"

[actions.move_forward]
kind = "button"
bindings = [{ type = "key", code = "KeyW" }, { type = "key", code = "ArrowUp" }]

[actions.move_backward]
kind = "button"
bindings = [{ type = "key", code = "KeyS" }, { type = "key", code = "ArrowDown" }]

[actions.move_left]
kind = "button"
bindings = [{ type = "key", code = "KeyA" }, { type = "key", code = "ArrowLeft" }]

[actions.move_right]
kind = "button"
bindings = [{ type = "key", code = "KeyD" }, { type = "key", code = "ArrowRight" }]

[actions.orbit_left]
kind = "button"
bindings = [{ type = "key", code = "KeyQ" }]

[actions.orbit_right]
kind = "button"
bindings = [{ type = "key", code = "KeyE" }]

[actions.zoom_in]
kind = "button"
bindings = [{ type = "key", code = "KeyR" }]

[actions.zoom_out]
kind = "button"
bindings = [{ type = "key", code = "KeyF" }]

[actions.home]
kind = "button"
bindings = [{ type = "key", code = "KeyH" }]

# The inventory panel (P5.4); the header's Inventory button does the same.
[actions.inventory]
kind = "button"
bindings = [{ type = "key", code = "KeyI" }]

# The spike's plan hairlines (scripts/spike.rhai), on P now that E orbits.
[actions.plan]
kind = "button"
bindings = [{ type = "key", code = "KeyP" }]

# Modifiers for a left click on the world (scripts/input.rhai, P4.3):
# shift-click a player to trade (P7.3), alt-click a plot to select it (P6.4).
[actions.with_shift]
kind = "button"
bindings = [{ type = "key", code = "ShiftLeft" }, { type = "key", code = "ShiftRight" }]

[actions.with_alt]
kind = "button"
bindings = [{ type = "key", code = "AltLeft" }, { type = "key", code = "AltRight" }]
