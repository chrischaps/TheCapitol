# The Capitol's input, layered over Flint's built-in defaults (which keep
# WASD as move_*, E as interact, and so on). The scene names it
# (input_config); a player's own rebinds go over it, in flint/input_capitol.toml
# under the OS config directory.
#
# The camera rig (scripts/camera.rhai) is laid out as in Cities: Skylines:
# WASD moves, Q/E orbit, R/F zoom, and the wheel zooms too (`zoom`, in
# notches, up is in). Home and +/- (both rows) work beside H and R/F.

version = 1
game_id = "capitol"

[actions.move_forward]
kind = "button"
bindings = [{ type = "key", code = "KeyW" }, { type = "key", code = "ArrowUp" }]

[actions.move_backward]
kind = "button"
bindings = [{ type = "key", code = "KeyS" }, { type = "key", code = "ArrowDown" }]

[actions.move_left]
kind = "button"
bindings = [{ type = "key", code = "KeyA" }, { type = "key", code = "ArrowLeft" }]

[actions.move_right]
kind = "button"
bindings = [{ type = "key", code = "KeyD" }, { type = "key", code = "ArrowRight" }]

[actions.orbit_left]
kind = "button"
bindings = [{ type = "key", code = "KeyQ" }]

[actions.orbit_right]
kind = "button"
bindings = [{ type = "key", code = "KeyE" }]

[actions.zoom_in]
kind = "button"
bindings = [
    { type = "key", code = "KeyR" },
    { type = "key", code = "Equal" },
    { type = "key", code = "NumpadAdd" },
]

[actions.zoom_out]
kind = "button"
bindings = [
    { type = "key", code = "KeyF" },
    { type = "key", code = "Minus" },
    { type = "key", code = "NumpadSubtract" },
]

# Wheel notches this frame; a touchpad's 50 px of scroll is one.
[actions.zoom]
kind = "axis1d"
bindings = [{ type = "mouse_wheel", axis = "y", scale = 1.0 }]

[actions.home]
kind = "button"
bindings = [{ type = "key", code = "KeyH" }, { type = "key", code = "Home" }]

# The inventory panel (P5.4); the header's Inventory button does the same.
[actions.inventory]
kind = "button"
bindings = [{ type = "key", code = "KeyI" }]

# The crafting panel (P5.5); the header's Crafting button does the same.
[actions.crafting]
kind = "button"
bindings = [{ type = "key", code = "KeyC" }]

# The exchange panel (P7.2); the header's Exchange button does the same.
[actions.exchange]
kind = "button"
bindings = [{ type = "key", code = "KeyX" }]

# The market panel (E3.5); the header's Market button does the same.
[actions.market]
kind = "button"
bindings = [{ type = "key", code = "KeyM" }]

# The Capitol Gazette (E3.9); the header's Gazette chip and a click on the
# notice board in the Exchange hall's forecourt do the same.
[actions.gazette]
kind = "button"
bindings = [{ type = "key", code = "KeyG" }]

# The shortcut overlay (P8.3). `?` opens it too, read off the typed
# character, so it's `?` on any layout. Binding Slash here as well would
# fire on the same keypress and toggle the overlay twice.
[actions.help]
kind = "button"
bindings = [{ type = "key", code = "F1" }]

# The settings panel (P8.4); the header's Settings link does the same.
[actions.settings]
kind = "button"
bindings = [{ type = "key", code = "F10" }]

# The dev overlay (D5.2): frame times, the net, the prediction, what the
# store holds and the interest cell. F2 to F4 are the engine's, F8 the
# control mode's (#319).
[actions.dev_overlay]
kind = "button"
bindings = [{ type = "key", code = "F7" }]

# The admin's world layers (D5.3): interest cells, nodes, the walk graph,
# the walkers, all, off. Only for an admin's token.
[actions.debug_layer]
kind = "button"
bindings = [{ type = "key", code = "F6" }]

# The control mode (T1.1): point and walk, or over the shoulder, swapped
# live for the A/B. Not F9, which is the engine's debug key.
[actions.control_mode]
kind = "button"
bindings = [{ type = "key", code = "F8" }]

# Craft what the crafting panel is set to, while it's open (P5.5), or what
# the open station's panel is set to (P6.3).
[actions.craft]
kind = "button"
bindings = [{ type = "key", code = "Enter" }]

# Open the nearest station, walking to it if it's out of reach (P6.3).
# The same as clicking it, and a key captures can press.
[actions.station]
kind = "button"
bindings = [{ type = "key", code = "KeyO" }]

# Trading (P7.3): accept the request you've been sent, or else ask the
# player nearest you, walking closer if they're out of range. A shift-click
# on someone does the same for them, and this is a key captures can press.
[actions.trade]
kind = "button"
bindings = [{ type = "key", code = "KeyT" }]

# Modifiers for a left click on the world (scripts/input.rhai, P4.3):
# shift-click a player to trade (P7.3), alt-click a plot to select it (P6.4).
[actions.with_shift]
kind = "button"
bindings = [{ type = "key", code = "ShiftLeft" }, { type = "key", code = "ShiftRight" }]

[actions.with_alt]
kind = "button"
bindings = [{ type = "key", code = "AltLeft" }, { type = "key", code = "AltRight" }]
