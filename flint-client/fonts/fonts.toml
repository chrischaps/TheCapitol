# Flint registers every font here under its file stem, for the script HUD
# (`draw_text(..., font)`) and for egui. These aliases are the names scripts
# and `ui/theme.rs` use.

[[font]]
name = "body"
file = "SourceSans3-Regular.ttf"

[[font]]
name = "strong"
file = "SourceSans3-Semibold.ttf"

[[font]]
name = "display"
file = "Cinzel.ttf"

# egui's default face, so every panel draws in Source Sans 3 (Flint ADR 0081).
[egui]
proportional = "body"
