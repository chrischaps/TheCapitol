# Chips and grit off a rock or a vein being worked (E2.5), as
# `gather_wood` is for wood: 1 while worked, a burst of 4 as it breaks.
# A few sparks where the pick strikes, for iron and flint alike.

name = "gather_stone"

[[emitters]]
name = "chips"
emission_rate = 14.0
max_particles = 64
lifetime = [0.5, 0.85]
speed = [1.6, 3.0]
direction = [0, 1, 0]
spread = 70.0
gravity = [0, -9.8, 0]
world_space = true
blend_mode = "alpha"
lighting = 1.0
shape_offset = [0, 0.7, 0]
size = { start = [0.06, 0.05], end = [0.05, 0.04] }
size_scale = [0.6, 1.5]
color = { keys = [ { t = 0.0, v = [0.62, 0.6, 0.56, 1.0] }, { t = 0.85, v = [0.55, 0.53, 0.5, 1.0] }, { t = 1.0, v = [0.55, 0.53, 0.5, 0.0] } ] }
brightness = [0.75, 1.2]
rotation = [0, 360]
angular_velocity = [-720, 720]

[emitters.shape]
kind = "sphere"
radius = 0.3

[[emitters]]
name = "grit"
emission_rate = 10.0
max_particles = 48
lifetime = [0.8, 1.4]
speed = [0.3, 0.8]
direction = [0, 1, 0]
spread = 50.0
gravity = [0.1, 0.15, 0]
damping = 1.2
world_space = true
blend_mode = "alpha"
lighting = 0.9
shape_offset = [0, 0.6, 0]
size = { keys = [ { t = 0.0, v = [0.08, 0.08] }, { t = 1.0, v = [0.3, 0.3] } ], interp = "smooth" }
color = { keys = [ { t = 0.0, v = [0.6, 0.58, 0.55, 0.0] }, { t = 0.2, v = [0.6, 0.58, 0.55, 0.25] }, { t = 1.0, v = [0.6, 0.58, 0.55, 0.0] } ] }

[emitters.shape]
kind = "sphere"
radius = 0.35

[[emitters]]
name = "sparks"
emission_rate = 3.0
max_particles = 16
lifetime = [0.15, 0.3]
speed = [2.0, 4.0]
direction = [0, 1, 0]
spread = 80.0
gravity = [0, -6.0, 0]
world_space = true
blend_mode = "additive"
