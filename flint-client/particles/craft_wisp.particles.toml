# A craft made on its own at a cool station (E4.4): a curl of pale dust
# and a wisp of smoke off the workbench, the sawbench or a crate, as if the
# work had just been knocked clean. A cousin of `craft_sparks`: blown the
# same way by `stations.rs`, silent at rest.

name = "craft_wisp"

[[emitters]]
name = "dust"
emission_rate = 14.0
max_particles = 40
lifetime = [0.6, 1.1]
speed = [0.5, 1.1]
direction = [0, 1, 0]
spread = 60.0
gravity = [0, -0.6, 0]
damping = 1.4
world_space = true
blend_mode = "alpha"
lighting = 1.0
size = { start = [0.07, 0.07], end = [0.04, 0.04] }
color = { keys = [ { t = 0.0, v = [0.85, 0.73, 0.54, 0.9] }, { t = 1.0, v = [0.85, 0.73, 0.54, 0.0] } ] }

[emitters.shape]
kind = "sphere"
radius = 0.2

[[emitters]]
name = "wisp"
emission_rate = 6.0
max_particles = 12
lifetime = [1.6, 2.4]
speed = [0.25, 0.45]
direction = [0, 1, 0]
spread = 12.0
gravity = [0.06, 0.2, 0.02]
damping = 0.4
world_space = true
blend_mode = "alpha"
size = { keys = [ { t = 0.0, v = [0.22, 0.22] }, { t = 1.0, v = [0.9, 0.9] } ], interp = "smooth" }
color = { keys = [ { t = 0.0, v = [0.6, 0.58, 0.55, 0.0] }, { t = 0.25, v = [0.6, 0.58, 0.55, 0.32] }, { t = 1.0, v = [0.66, 0.65, 0.64, 0.0] } ] }

[emitters.shape]
kind = "sphere"
radius = 0.08
