# CI for the backend, the shared protocol and the Flint client (E0.1, #144).
# Two jobs, one per Cargo workspace: the root (backend + protocol) and
# flint-client/ (its own workspace; the engine is a subtree under it).
#
# Nightly and on demand, not on push (#270). Landing runs only the smoke test
# (`scripts/ci.sh`), so this is where the suites run. Run it on a branch with
#   gh workflow run ci.yml --ref issue-<n>
# A nightly that fails opens an issue labelled bug and infra, or comments on
# the one already open, so the next agent picks it up first.
name: CI

on:
  schedule:
    # 09:00 UTC: the small hours in America, after the day's landings.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only cost cache space on a fresh runner.
  CARGO_INCREMENTAL: 0

jobs:
  backend:
    name: Backend and protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The same images as docker-compose.yml. Postgres listens on 5432 here,
      # not the 5433 the local stack uses.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: capitol
          POSTGRES_PASSWORD: capitol_dev
          POSTGRES_DB: capitol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capitol"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # `sqlx::test` makes a throwaway database per test from this server.
      DATABASE_URL: postgres://capitol:capitol_dev@localhost:5432/capitol
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      # The Rust in rust-toolchain.toml, with its clippy (#265). Not @stable:
      # a floating stable let CI and an agent's verify disagree on clippy.
      - name: Rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # The steps live in scripts/ci.sh, which agents run as `ci.sh full`.
      - name: Clippy
        run: scripts/ci.sh clippy
      - name: Tests
        run: scripts/ci.sh test
      # The database tests are `#[ignore]`d so a plain `cargo test` passes
      # without the docker stack. Here the stack is up, so run them, less the
      # tools ci.sh skips.
      - name: Database tests
        run: scripts/ci.sh db

  flint-client:
    name: Flint client
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flint-client
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install && rustc --version
      # cpal (audio) links ALSA and gilrs (gamepads) links udev. winit loads
      # X11 and Wayland at run time, so a check needs no display libraries.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flint-client
      # In flint-client/: capitol-core's tests, then capitol-client's.
      - name: Flint client
        working-directory: .
        run: scripts/ci.sh flint

  # A red nightly becomes an issue, so it's seen: nobody watches the runs.
  report:
    name: Report a failed nightly
    needs: [backend, flint-client]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "Nightly CI failed"
    steps:
      - name: Open or update the issue
        run: |
          body="The nightly CI run failed on master at ${GITHUB_SHA::7}: $RUN_URL

          Reproduce with \`scripts/ci.sh full\` (and \`scripts/ci.sh flint\` if the Flint job failed). Fix it like any issue, with \`Closes #<n>\`."
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$TITLE" --label bug --label infra --body "$body"
          fi
